<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Pro Tracker | Spaced Revision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Aapka Screenshot wala Config
        const firebaseConfig = {
            apiKey: "AIzaSyAvZDXd_ZxngXmlo5_C4YpXN_8oD3h0g", 
            authDomain: "neet-tracker-cc5b2.firebaseapp.com",
            projectId: "neet-tracker-cc5b2",
            storageBucket: "neet-tracker-cc5b2.appspot.com",
            messagingSenderId: "792032164742",
            appId: "1:792032164742:web:e9b60e6e730073286b0f02",
            measurementId: "G-C5S1MM8DZV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const studentId = "nishat_01"; // Aapki Unique ID

        // Function: Data Firebase mein bhejta hai aur Spaced Revision date set karta hai
        window.markComplete = async (chapter) => {
            const today = new Date();
            const nextRev = new Date();
            nextRev.setDate(today.getDate() + 3); // Agli revision 3 din baad

            try {
                await setDoc(doc(db, "students", studentId), {
                    [chapter]: {
                        status: "Completed",
                        completedDate: today.toLocaleDateString(),
                        nextRevision: nextRev.toLocaleDateString(),
                        health: "Good (Green)"
                    }
                }, { merge: true });
                alert("✅ " + chapter + " Saved! Next Revision: " + nextRev.toLocaleDateString());
            } catch (e) {
                alert("Error: " + e.message);
            }
        };

        // Real-time listener: Database se status check karne ke liye
        onSnapshot(doc(db, "students", studentId), (doc) => {
            if (doc.exists()) {
                const data = doc.data();
                Object.keys(data).forEach(chap => {
                    const el = document.getElementById(chap + "-status");
                    if (el) el.innerText = "Next Rev: " + data[chap].nextRevision;
                });
            }
        });
    </script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen p-5">

    <div class="max-w-md mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-400">NEET Smart Tracker</h1>
            <p class="text-slate-400 text-sm mt-2">Spaced Revision Enabled 🧠</p>
        </header>

        <section class="mb-8">
            <h2 class="text-xl font-semibold mb-4 border-l-4 border-green-500 pl-3">Biology (High Yield)</h2>
            <div class="space-y-3">
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center shadow-lg">
                    <div>
                        <p class="font-medium">Biological Classification</p>
                        <span id="Bio-Class-status" class="text-xs text-green-400">Not Started</span>
                    </div>
                    <button onclick="markComplete('Bio-Class')" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg text-sm transition">Tick</button>
                </div>
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center shadow-lg">
                    <div>
                        <p class="font-medium">Plant Kingdom</p>
                        <span id="Plant-King-status" class="text-xs text-green-400">Not Started</span>
                    </div>
                    <button onclick="markComplete('Plant-King')" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg text-sm transition">Tick</button>
                </div>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="text-xl font-semibold mb-4 border-l-4 border-blue-500 pl-3">Physics (Concepts)</h2>
            <div class="space-y-3">
                <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center shadow-lg">
                    <div>
                        <p class="font-medium">Units & Measurements</p>
                        <span id="Units-status" class="text-xs text-blue-400">Not Started</span>
                    </div>
                    <button onclick="markComplete('Units')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm transition">Tick</button>
                </div>
            </div>
        </section>

        <footer class="text-center text-slate-500 text-xs mt-10">
            Connected to Google Firebase Cloud ☁️
        </footer>
    </div>

</body>
</html>
