<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Full Syllabus Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .progress-transition { transition: width 0.5s ease-in-out; }
        body { background-color: #f9fafb; font-family: sans-serif; }
        .subject-card { margin-bottom: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="pb-20">

    <div class="bg-blue-600 text-white p-6 rounded-b-3xl shadow-lg mb-6 text-center">
        <h1 class="text-3xl font-extrabold">NEET 2026 Pro</h1>
        <p class="opacity-80 mt-1">Focus. Track. Conquer.</p>
        
        <div class="mt-6 bg-white/20 p-4 rounded-xl backdrop-blur-sm">
            <div class="flex justify-between text-sm font-bold mb-1">
                <span>Total Progress</span>
                <span id="overall-percent">0%</span>
            </div>
            <div class="w-full bg-white/30 rounded-full h-3">
                <div id="overall-bar" class="bg-yellow-400 h-3 rounded-full progress-transition" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4">
        
        <div class="subject-card bg-white">
            <div class="bg-green-500 p-3 flex justify-between items-center">
                <h2 class="text-white font-bold">Biology (Full)</h2>
                <span id="bio-stats" class="text-xs text-white bg-black/20 px-2 py-1 rounded">0/0</span>
            </div>
            <div id="bio-list" class="p-3 space-y-2 max-h-80 overflow-y-auto"></div>
        </div>

        <div class="subject-card bg-white">
            <div class="bg-orange-500 p-3 flex justify-between items-center">
                <h2 class="text-white font-bold">Chemistry (Full)</h2>
                <span id="chem-stats" class="text-xs text-white bg-black/20 px-2 py-1 rounded">0/0</span>
            </div>
            <div id="chem-list" class="p-3 space-y-2 max-h-80 overflow-y-auto"></div>
        </div>

        <div class="subject-card bg-white">
            <div class="bg-red-500 p-3 flex justify-between items-center">
                <h2 class="text-white font-bold">Physics (Full)</h2>
                <span id="phy-stats" class="text-xs text-white bg-black/20 px-2 py-1 rounded">0/0</span>
            </div>
            <div id="phy-list" class="p-3 space-y-2 max-h-80 overflow-y-auto"></div>
        </div>

    </div>

    <script>
        const syllabus = {
            bio: ["Diversity in Living World", "Structural Org in Animals/Plants", "Cell: Structure & Function", "Plant Physiology", "Human Physiology", "Reproduction", "Genetics & Evolution", "Biology & Human Welfare", "Biotechnology", "Ecology & Environment"],
            chem: ["Some Basic Concepts", "Atomic Structure", "Classification of Elements", "Chemical Bonding", "States of Matter", "Thermodynamics", "Equilibrium", "Redox Reactions", "Hydrogen & s-Block", "p-Block Elements", "Organic Chem: Basics", "Hydrocarbons", "Solid State", "Solutions", "Electrochemistry", "Chemical Kinetics", "Surface Chemistry", "d & f Block", "Coordination Compounds", "Haloalkanes", "Alcohols & Phenols", "Aldehydes & Ketones", "Amines", "Biomolecules", "Polymers"],
            phy: ["Physical World & Measurement", "Kinematics", "Laws of Motion", "Work, Energy & Power", "System of Particles", "Gravitation", "Properties of Bulk Matter", "Thermodynamics", "Oscillations & Waves", "Electrostatics", "Current Electricity", "Magnetic Effects", "Magnetism", "Electromagnetic Induction", "AC", "Electromagnetic Waves", "Optics", "Dual Nature of Matter", "Atoms & Nuclei", "Electronic Devices"]
        };

        function render() {
            const data = JSON.parse(localStorage.getItem('neetPro')) || {};
            
            Object.keys(syllabus).forEach(sub => {
                const list = document.getElementById(`${sub}-list`);
                list.innerHTML = "";
                syllabus[sub].forEach(ch => {
                    const checked = data[ch] ? 'checked' : '';
                    list.innerHTML += `
                        <div class="flex items-center justify-between border-b border-gray-100 py-2">
                            <span class="text-sm text-gray-600">${ch}</span>
                            <input type="checkbox" ${checked} onchange="toggle('${ch}', this.checked)" class="w-5 h-5 rounded border-gray-300">
                        </div>
                    `;
                });
            });
            update();
        }

        function toggle(ch, val) {
            const data = JSON.parse(localStorage.getItem('neetPro')) || {};
            data[ch] = val;
            localStorage.setItem('neetPro', JSON.stringify(data));
            update();
        }

        function update() {
            const data = JSON.parse(localStorage.getItem('neetPro')) || {};
            let total = 0;
            let done = 0;

            Object.keys(syllabus).forEach(sub => {
                let subTotal = syllabus[sub].length;
                let subDone = syllabus[sub].filter(ch => data[ch]).length;
                document.getElementById(`${sub}-stats`).innerText = `${subDone}/${subTotal}`;
                total += subTotal;
                done += subDone;
            });

            const p = Math.round((done / total) * 100) || 0;
            document.getElementById('overall-bar').style.width = p + '%';
            document.getElementById('overall-percent').innerText = p + '%';
        }

        render();
    </script>
</body>
</html>
